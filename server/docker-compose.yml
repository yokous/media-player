services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediaplayer
      POSTGRES_USER: mediaplayer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaplayer -d mediaplayer"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/mediaplayer
      DB_USER: mediaplayer
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  dbdata:
