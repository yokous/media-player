name: Server tests

on:
  push:
    branches: [main, server]
    paths: ['server/**', '.github/workflows/server-tests.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-tests.yml']

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run tests
        run: gradle test --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test
  api-collection:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Start server
        working-directory: server
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-password/; s/^JWT_SECRET=.*/JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret/' .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/v1/health && break || sleep 3; done
      - name: Run Bruno collection
        working-directory: server/bruno
        run: npx --yes @usebruno/cli@1 run --env local
      - name: Server logs on failure
        if: failure()
        working-directory: server
        run: docker compose logs api
